  <line x1="6" y1="32" x2="58" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Zigzag pleat edges -->
  <path d="M 7 10 L 11 32 L 7 54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
  <path d="M 57 10 L 53 32 L 57 54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.7"/>
</svg>