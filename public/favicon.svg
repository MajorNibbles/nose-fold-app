  </defs>
  <!-- Top folded paper flap -->
  <path d="M 8 12 C 8 7 12 4 18 4 L 46 4 C 52 4 56 7 56 12 L 54 31 C 54 31.5 53.5 32 53 32 L 11 32 C 10.5 32 10 31.5 10 31 Z" fill="url(#favTop)"/>
